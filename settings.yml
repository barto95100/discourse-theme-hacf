featured_categories:
  type: objects
  default: []
  schema:
    name: carte
    properties:
      category:
        type: categories
        required: true
        validations:
          min: 1
          max: 1
      title:
        type: string
        required: false
        validations:
          max_length: 60
      description:
        type: string
        required: false
        validations:
          max_length: 160
      icon:
        type: icon
        required: false

show_hot_topics:
  type: bool
  default: true

hot_topics_count:
  type: integer
  default: 5
  min: 1
  max: 10

hot_topics_icon:
  type: icon
  default: fire

show_upcoming_events:
  type: bool
  default: true

upcoming_events_count:
  type: integer
  default: 3
  min: 1
  max: 6

upcoming_events_icon:
  type: icon
  default: calendar-days

show_top_contributors:
  type: bool
  default: true

top_contributors_count:
  type: integer
  default: 5
  min: 1
  max: 10

top_contributors_icon:
  type: icon
  default: trophy

top_contributors_exclude:
  type: string
  default: ""
  description: "Pseudos à exclure du classement, séparés par des virgules (sans @)"

top_contributors_leaderboard_id:
  type: integer
  default: 2
  min: 1

presence_url:
  type: string
  default: "https://n8n-new.hacf.fr/webhook/hacf-presence"
  description: "Adresse JSON de la liste des membres en ligne (vide = fonction désactivée)"

presence_max_avatars:
  type: integer
  default: 20
  min: 1
  max: 50
  description: "Nombre maximum d'avatars affichés dans « En ligne maintenant » (le total reste affiché)"

banner_enabled:
  type: bool
  default: false
  description: "Bandeau d'annonce de l'équipe : afficher le bandeau"

banner_message:
  type: string
  default: ""
  textarea: true
  max: 400
  description: "Bandeau d'annonce : message affiché (texte simple)"

banner_type:
  type: enum
  default: info
  choices:
    - info
    - success
    - warning
  description: "Bandeau d'annonce : type (info = bleu, success = vert, warning = orange)"

banner_link_url:
  type: string
  default: ""
  description: "Bandeau d'annonce : lien du bouton (optionnel, ex. https://… ou /t/…)"

banner_link_label:
  type: string
  default: "En savoir plus"
  description: "Bandeau d'annonce : libellé du bouton"

banner_expires:
  type: string
  default: ""
  description: "Bandeau d'annonce : date d'expiration au format AAAA-MM-JJ (optionnel, masqué après ce jour)"

banner_dismissible:
  type: bool
  default: true
  description: "Bandeau d'annonce : permettre aux membres de le fermer (réapparaît si le message change)"

banner_badge:
  type: string
  default: "Nouveau"
  description: "Bandeau d'annonce : pastille avant le message (ex. Nouveau, Info, Important ; vide = aucune)"
