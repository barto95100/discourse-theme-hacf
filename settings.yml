featured_categories:
  type: objects
  default: []
  schema:
    name: carte
    properties:
      category:
        type: categories
        required: true
        validations:
          min: 1
          max: 1
      title:
        type: string
        required: false
        validations:
          max_length: 60
      description:
        type: string
        required: false
        validations:
          max_length: 160
      icon:
        type: icon
        required: false

show_hot_topics:
  type: bool
  default: true

hot_topics_count:
  type: integer
  default: 5
  min: 1
  max: 10

hot_topics_icon:
  type: icon
  default: fire

show_upcoming_events:
  type: bool
  default: true

upcoming_events_count:
  type: integer
  default: 3
  min: 1
  max: 6

upcoming_events_icon:
  type: icon
  default: calendar-days

show_top_contributors:
  type: bool
  default: true

top_contributors_count:
  type: integer
  default: 5
  min: 1
  max: 10

top_contributors_icon:
  type: icon
  default: trophy

top_contributors_exclude:
  type: string
  default: ""
  description: "Pseudos à exclure du classement, séparés par des virgules (sans @)"

top_contributors_leaderboard_id:
  type: integer
  default: 2
  min: 1

presence_url:
  type: string
  default: "https://n8n-new.hacf.fr/webhook/hacf-presence"
  description: "Adresse JSON de la liste des membres en ligne (vide = fonction désactivée)"

presence_max_avatars:
  type: integer
  default: 20
  min: 1
  max: 50
  description: "Nombre maximum d'avatars affichés dans « En ligne maintenant » (le total reste affiché)"
